
services:
  bili-db:
    image: mysql:5.7
    container_name: bili-db
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luckybili}
      MYSQL_USER: ${MYSQL_USER:-luckybili}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3206:3306"
    volumes:
      - ./lib/init_db_script.sql:/docker-entrypoint-initdb.d/init_db_script.sql  # 挂载init_db_script.sql文件到容器内的初始化目录
      - ./db_data:/var/lib/mysql  # 持久化MySQL数据
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s


  bili-selenium:
    image: selenium/standalone-chrome:latest
    container_name: bili-selenium
    ports:
      - 5555:4444
      - "127.0.0.1:7900:7900"
    shm_size: 1g
    mem_limit: 2g
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_MAX_INSTANCES=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_SESSION_TIMEOUT=120
      - VNC_NO_PASSWORD=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4444/status | grep -q '\"availability\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 执行转发动态的服务
  dynamic_share:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./cookie:/app/cookie
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: bili-db
      PORT: ${APP_DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luckybili}
      MYSQL_USER: ${MYSQL_USER:-luckybili}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      home_url: ${home_url:-https://www.bilibili.com/}
      my_user_id: ${my_user_id:-test_id}
      ignore_link: ${ignore_link:-}
      multi_users: ${multi_users:-test_id}
      do_type: ${do_type:-single}
      is_remove: ${is_remove:-N}
      remove_cnt: ${remove_cnt:-50}
      cookie_value: ${cookie_value:-}
      bili_jct: ${bili_jct:-}
      notify_switch: ${notify_switch:-N}
      FangTang_KEY: ${FangTang_KEY:-}
      share_content: ${share_content:-抽奖啦!}
      comment_content: ${comment_content:-参与一下}
      ups: ${ups:-}
      DRIVER_VERSION: Online
      SELENIUM_HOST: bili-selenium
      SELENIUM_PORT: 4444
      SELENIUM_PATH: /wd/hub
      SCHEDULE_INTERVAL_HOURS: 3
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-24}
      SHARE_BATCH_LIMIT: 0
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-false}
      CLEANUP_DRY_RUN: ${CLEANUP_DRY_RUN:-true}
      UNFOLLOW_ENABLED: ${UNFOLLOW_ENABLED:-false}
      SHARE_BROWSER_RECYCLE_EVERY: 20
      SHARE_RESTART_ERROR_LIMIT: 3
      SELENIUM_PAGE_LOAD_TIMEOUT: 60
      SCAN_CACHE_RETRY_HOURS: 24
    restart: always
    depends_on:
      bili-selenium:
        condition: service_healthy
      bili-db:
        condition: service_healthy

  admin_web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "admin_web.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app
      - ./cookie:/app/cookie
      - ./Log:/app/Log
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: bili-db
      PORT: ${APP_DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luckybili}
      MYSQL_USER: ${MYSQL_USER:-luckybili}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      home_url: ${home_url:-https://www.bilibili.com/}
      my_user_id: ${my_user_id:-test_id}
      ignore_link: ${ignore_link:-}
      multi_users: ${multi_users:-test_id}
      do_type: ${do_type:-single}
      is_remove: ${is_remove:-N}
      remove_cnt: ${remove_cnt:-50}
      cookie_value: ${cookie_value:-}
      bili_jct: ${bili_jct:-}
      notify_switch: ${notify_switch:-N}
      FangTang_KEY: ${FangTang_KEY:-}
      share_content: ${share_content:-抽奖啦!}
      comment_content: ${comment_content:-参与一下}
      ups: ${ups:-}
      DRIVER_VERSION: Online
      SELENIUM_HOST: bili-selenium
      SELENIUM_PORT: 4444
      SELENIUM_PATH: /wd/hub
      COOKIE_DIR: /app/cookie
    restart: always
    depends_on:
      bili-selenium:
        condition: service_healthy
      bili-db:
        condition: service_healthy



